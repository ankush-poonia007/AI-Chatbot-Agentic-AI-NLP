<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuraChat — Chat</title>
  <meta name="description" content="Chat with NeuraChat — persistent memory and Gemini-powered responses." />
  <meta property="og:title" content="NeuraChat — Chat" />
  <meta property="og:description" content="Persistent memory and Gemini-powered AI conversations." />
  <meta property="og:image" content="/static/assets/og-image.png" />
  <link rel="icon" href="/static/assets/favicon.png" type="image/png" sizes="256x256" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            body: ['DM Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <link rel="stylesheet" href="/css/chat.css" />
</head>
<body class="bg-app text-app font-body antialiased overflow-x-hidden">
  <script src="/js/protect.js"></script>
  <canvas id="particle-canvas" class="fixed inset-0 z-0 pointer-events-none opacity-70" aria-hidden="true"></canvas>

  <div id="sidebar-backdrop" class="fixed inset-0 z-30 bg-black/50 opacity-0 pointer-events-none transition-opacity lg:hidden"></div>

  <div class="chat-app relative z-10 flex min-h-0">
    <!-- Sidebar -->
    <aside
      id="chat-sidebar"
      class="chat-sidebar fixed bottom-0 left-0 top-0 z-40 flex flex-col border-r border-[var(--border)] bg-[var(--bg-surface)] lg:static lg:z-10"
    >
      <div class="flex items-center justify-between gap-2 border-b border-[var(--border)] px-3 py-3">
        <a href="/" class="flex min-w-0 items-center gap-2 rounded-xl px-1 py-1 hover:bg-[var(--bg-hover)]">
          <span class="h-2.5 w-2.5 shrink-0 rounded-full bg-[var(--accent)]"></span>
          <span class="font-display text-sm font-bold tracking-tight text-[var(--text-primary)]">NeuraChat</span>
        </a>
        <button
          type="button"
          id="btn-sidebar-collapse"
          class="hidden rounded-xl p-2 text-[var(--text-muted)] hover:bg-[var(--bg-hover)] hover:text-[var(--accent)] lg:inline-flex"
          aria-label="Collapse sidebar"
        >
          <i data-lucide="panel-left-close" class="h-5 w-5"></i>
        </button>
      </div>

      <div class="p-3">
        <button
          type="button"
          id="btn-new-chat"
          class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-[var(--accent)] py-3 text-sm font-semibold text-[#0f172a] shadow-[var(--shadow-accent)] transition-all hover:bg-[var(--accent-hover)] hover:scale-[1.01] active:scale-[0.99]"
        >
          <i data-lucide="plus" class="h-5 w-5"></i>
          New Chat
        </button>
      </div>

      <div id="chat-history-scroll" class="min-h-0 flex-1 overflow-y-auto px-2 pb-3">
        <div id="chat-history-groups"></div>
      </div>

      <div class="mt-auto border-t border-[var(--border)] p-3">
        <div class="flex items-center gap-3">
          <img id="sidebar-avatar" src="" alt="" class="h-8 w-8 shrink-0 rounded-full border border-[var(--border)] bg-[var(--bg-surface-2)]" width="32" height="32" />
          <div class="min-w-0 flex-1">
            <p id="sidebar-username" class="truncate text-sm font-semibold text-[var(--text-primary)]">…</p>
            <span id="sidebar-plan-badge" class="mt-0.5 inline-block rounded-full bg-[var(--bg-surface-2)] px-2 py-0.5 text-[10px] font-bold text-[var(--text-muted)]">FREE</span>
          </div>
          <a
            href="/profile.html"
            class="rounded-xl p-2 text-[var(--text-muted)] hover:bg-[var(--bg-hover)] hover:text-[var(--accent)]"
            aria-label="Profile settings"
          >
            <i data-lucide="settings" class="h-5 w-5"></i>
          </a>
        </div>
      </div>
    </aside>

    <button
      type="button"
      id="sidebar-expand"
      class="chat-sidebar-expand fixed left-0 top-1/2 z-20 -translate-y-1/2 rounded-r-xl border border-l-0 border-[var(--border)] bg-[var(--bg-surface)] px-1.5 py-4 text-[var(--text-muted)] shadow-md hover:text-[var(--accent)]"
      aria-label="Expand sidebar"
    >
      <i data-lucide="panel-left" class="h-5 w-5"></i>
    </button>

    <!-- Main -->
    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex shrink-0 items-center justify-between gap-3 border-b border-[var(--border)] bg-[var(--bg-primary)]/80 px-3 py-3 backdrop-blur-md sm:px-4">
        <div class="flex min-w-0 flex-1 items-center gap-2">
          <button
            type="button"
            id="btn-sidebar-toggle"
            class="inline-flex rounded-xl p-2 text-[var(--text-secondary)] hover:bg-[var(--bg-hover)] hover:text-[var(--accent)] lg:hidden"
            aria-label="Open chat history"
          >
            <i data-lucide="menu" class="h-5 w-5"></i>
          </button>
          <div class="min-w-0 flex-1">
            <h1 class="truncate font-display text-base font-bold text-[var(--text-primary)] sm:text-lg">
              <span
                id="chat-title-text"
                class="select-none lg:cursor-text"
                title="Double-click to rename (when a chat is open)"
              >New chat</span>
              <input
                id="chat-title-input"
                type="text"
                class="hidden w-full max-w-md rounded-xl border border-[var(--border-accent)] bg-[var(--bg-surface)] px-3 py-1.5 font-display text-base font-bold text-[var(--text-primary)] outline-none ring-2 ring-transparent focus:ring-[var(--accent)]/40"
                maxlength="120"
                aria-label="Chat title"
              />
            </h1>
          </div>
        </div>
        <div class="flex shrink-0 items-center gap-2">
          <span class="inline-flex shrink-0 items-center rounded-full border border-[var(--border)] bg-[var(--bg-surface)] px-2.5 py-1 text-[10px] font-medium text-[var(--text-secondary)] sm:px-3 sm:text-xs">Gemini 2.5 Flash</span>
          <button
            type="button"
            data-theme-toggle
            class="rounded-full border border-[var(--border)] bg-[var(--bg-surface)] p-2 text-[var(--text-secondary)] hover:border-[var(--border-accent)] hover:text-[var(--accent)]"
            aria-label="Toggle theme"
          >
            <i data-theme-icon data-lucide="sun" class="h-5 w-5"></i>
          </button>
        </div>
      </header>

      <div class="relative min-h-0 flex-1 flex flex-col bg-[var(--bg-primary)]">
        <!-- Empty state -->
        <div id="empty-state" class="flex flex-1 flex-col items-center justify-center px-4 py-8">
          <div
            class="empty-state-logo mb-6 flex h-16 w-16 items-center justify-center rounded-2xl border border-[var(--border-accent)] bg-[var(--bg-surface)] mock-chat-glow"
            aria-hidden="true"
          >
            <span class="h-4 w-4 rounded-full bg-[var(--accent)] ring-4 ring-[var(--accent)]/25"></span>
          </div>
          <h2 class="font-display text-2xl font-extrabold text-[var(--text-primary)]">How can I help you today?</h2>
          <p class="mt-2 max-w-md text-center text-[var(--text-secondary)]">Ask anything. I remember our conversation.</p>
          <div class="mt-10 grid w-full max-w-lg grid-cols-1 gap-3 sm:grid-cols-2">
            <button type="button" class="suggest-card rounded-xl border border-[var(--border)] bg-[var(--bg-surface)] p-4 text-left text-sm text-[var(--text-secondary)] transition-all hover:-translate-y-0.5 hover:border-[var(--border-accent)] hover:shadow-md" data-prompt="Explain machine learning simply">
              Explain machine learning simply
            </button>
            <button type="button" class="suggest-card rounded-xl border border-[var(--border)] bg-[var(--bg-surface)] p-4 text-left text-sm text-[var(--text-secondary)] transition-all hover:-translate-y-0.5 hover:border-[var(--border-accent)] hover:shadow-md" data-prompt="Write a Python function for sorting">
              Write a Python function for sorting
            </button>
            <button type="button" class="suggest-card rounded-xl border border-[var(--border)] bg-[var(--bg-surface)] p-4 text-left text-sm text-[var(--text-secondary)] transition-all hover:-translate-y-0.5 hover:border-[var(--border-accent)] hover:shadow-md" data-prompt="What is the difference between REST and GraphQL?">
              What is the difference between REST and GraphQL?
            </button>
            <button type="button" class="suggest-card rounded-xl border border-[var(--border)] bg-[var(--bg-surface)] p-4 text-left text-sm text-[var(--text-secondary)] transition-all hover:-translate-y-0.5 hover:border-[var(--border-accent)] hover:shadow-md" data-prompt="Help me debug this error">
              Help me debug this error
            </button>
          </div>
        </div>

        <!-- Messages -->
        <div id="messages-thread" class="hidden min-h-0 flex-1 overflow-y-auto px-3 py-4 sm:px-6"></div>

        <!-- Composer -->
        <div class="shrink-0 border-t border-[var(--border)] bg-[var(--bg-surface)] px-3 py-3 sm:px-4">
          <div id="limit-reached-block" class="chat-limit-panel mb-3 hidden p-4 text-center">
            <p class="font-display text-sm font-bold text-[var(--text-primary)]">Limit reached</p>
            <p class="mt-1 text-xs text-[var(--text-secondary)]">You have used all free messages this month.</p>
            <button
              type="button"
              id="btn-upgrade-limit"
              class="mt-4 inline-flex w-full items-center justify-center rounded-xl bg-[var(--accent)] py-3 text-sm font-semibold text-[#0f172a] shadow-[var(--shadow-accent)] transition-all hover:bg-[var(--accent-hover)] sm:w-auto sm:px-8"
            >
              Upgrade to Pro
            </button>
          </div>

          <div id="membership-bar" class="mb-3 hidden">
            <div class="mb-1 flex flex-wrap items-center justify-between gap-2 text-xs text-[var(--text-muted)]">
              <span id="membership-text">0 / 50 messages used this month</span>
              <button type="button" id="btn-upgrade-chat" class="font-semibold text-[var(--accent)] hover:underline">Upgrade to Pro</button>
            </div>
            <div class="h-1 overflow-hidden rounded-full bg-[var(--bg-surface-2)]">
              <div id="membership-fill" class="h-full rounded-full bg-[var(--accent)] transition-all" style="width: 0%"></div>
            </div>
            <p id="membership-warn" class="mt-2 hidden text-xs font-medium text-amber-400/90"></p>
          </div>
          <div id="composer-row" class="flex items-end gap-2">
            <div class="relative min-w-0 flex-1">
              <textarea
                id="message-input"
                rows="1"
                maxlength="8000"
                class="chat-input w-full rounded-xl border border-[var(--border)] bg-[var(--bg-surface-2)] px-4 py-3 text-sm text-[var(--text-primary)] placeholder:text-[var(--text-muted)] outline-none ring-2 ring-transparent transition-shadow focus:border-[var(--border-accent)] focus:ring-[var(--accent)]/25"
                placeholder="Message NeuraChat..."
                autocomplete="off"
              ></textarea>
            </div>
            <div class="flex flex-col items-end gap-1 pb-1">
              <span id="char-count" class="text-[10px] text-[var(--text-muted)]">0</span>
              <button
                type="button"
                id="btn-send"
                disabled
                class="inline-flex h-11 w-11 items-center justify-center rounded-full bg-[var(--accent)] text-[#0f172a] shadow-[var(--shadow-accent)] transition-all hover:bg-[var(--accent-hover)] disabled:cursor-not-allowed disabled:opacity-40"
                aria-label="Send message"
              >
                <i data-lucide="arrow-up" class="h-5 w-5"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/cursor.js"></script>
  <script src="/js/preloader.js"></script>
  <script src="/js/animations.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="/js/chat.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
