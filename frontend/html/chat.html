<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../css/chat.css">
</head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden">
<!-- TopNavBar -->
<header class="fixed top-4 left-1/2 -translate-x-1/2 w-[95%] rounded-xl border border-white/10 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl shadow-[0_0_20px_rgba(76,215,246,0.1)] z-50">
<div class="flex justify-between items-center px-6 py-3 max-w-7xl mx-auto">
<div class="flex items-center gap-8">
<span class="font-headline-lg text-headline-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">NeuraChat</span>
<nav class="hidden md:flex items-center gap-6">
<a class="font-headline-md text-headline-md text-on-surface-variant hover:text-primary transition-colors hover:scale-105 transition-transform duration-200" href="/">Home</a>
<a class="font-headline-md text-headline-md text-secondary border-b-2 border-secondary pb-1 hover:scale-105 transition-transform duration-200" href="/chat.html">Chat</a>
<a class="font-headline-md text-headline-md text-on-surface-variant hover:text-primary transition-colors hover:scale-105 transition-transform duration-200" href="/docs.html">Docs</a>
<a class="font-headline-md text-headline-md text-on-surface-variant hover:text-primary transition-colors hover:scale-105 transition-transform duration-200" href="/contact.html">Contact</a>
</nav>
</div>
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-colors active:scale-95">notifications</button>
<button class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-colors active:scale-95">settings</button>
<div class="h-8 w-8 rounded-full bg-surface-variant flex items-center justify-center border border-white/10 overflow-hidden active:scale-95 transition-all">
<img alt="User profile avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHpqSEExi4CE4Oa-zJm-4rw6lKgT9uWjs0Mm9K12KIINpOg2-v_qTvRpTmhl3aWjxKXqU6MfDXRDG5XhL-x-TRPL_BA8WWUc0xjABUOyBOa2H4KORS0swBbjA19EsMczwDxytcHgTFVHZa4WxcqgbCX1IekTAQXIx9EJDJVLq5avPilGNMIDFCq94quNqAV6XXRiDB_1eZcCXnVmqVBchwcqKkr8jpBzNMCnb30hrw0ihZg8a2eSAknUx76HLWlEoLCWk3zfgrMyN1"/>
</div>
</div>
</div>
</header>
<main class="flex h-screen pt-24 pb-4 px-4 gap-4 max-w-[1440px] mx-auto">
<!-- Sidebar: Conversation History -->
<aside class="hidden lg:flex flex-col w-80 glass-panel rounded-2xl overflow-hidden">
<div class="p-6">
<button id="newChatBtn" class="w-full py-4 px-6 bg-gradient-to-r from-primary-container to-inverse-primary text-on-primary-container font-label-md text-label-md rounded-xl flex items-center justify-center gap-2 bloom-primary hover:brightness-110 hover:scale-[1.02] transition-all">
<span class="material-symbols-outlined">add</span>
                    New Chat
                </button>
</div>
<div id="chatHistoryList" class="flex-1 overflow-y-auto px-4 pb-6 space-y-2"></div>
</aside>
<!-- Main Chat Area -->
<section class="flex-1 flex flex-col glass-panel rounded-2xl relative overflow-hidden">
<!-- Chat Header Info -->
<div class="px-8 py-4 border-b border-white/5 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-secondary bloom-secondary"></div>
<h2 class="font-headline-md text-headline-md text-on-surface">Neural Interface Alpha</h2>
</div>
<div class="flex gap-4">
<div class="flex flex-col items-end">
<span class="text-caption font-caption text-secondary">742ms processing</span>
<span class="text-caption font-caption text-outline">v4.2.0-stable</span>
</div>
</div>
</div>
<!-- Messages Area -->
<div class="flex-1 overflow-y-auto p-8 space-y-8 flex flex-col" id="messagesArea">
</div>
<!-- Input Bar -->
<div class="p-6 bg-gradient-to-t from-surface-container-lowest to-transparent">
<div class="relative group">
<div class="absolute -inset-0.5 bg-gradient-to-r from-primary/20 to-secondary/20 rounded-2xl blur opacity-30 group-focus-within:opacity-100 transition duration-500"></div>
<div class="relative flex items-center gap-3 p-2 bg-surface-container-lowest glass-panel rounded-2xl border-white/10 group-focus-within:border-secondary/40 transition-all">
<button class="p-3 text-on-surface-variant hover:text-secondary transition-colors material-symbols-outlined active:scale-95">attach_file</button>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-outline font-body-md py-3 px-2" placeholder="Describe the neural interface..." type="text" id="userInput"/>
<div class="flex items-center gap-2 px-2">
<button class="p-3 text-on-surface-variant hover:text-primary transition-colors material-symbols-outlined active:scale-95">mic</button>
<button class="bg-primary-container hover:bg-inverse-primary text-on-primary-container px-6 py-3 rounded-xl font-label-md text-label-md transition-all bloom-primary active:scale-95 flex items-center gap-2" id="sendBtn" >
                                Send
                                <span class="material-symbols-outlined text-[20px]">send</span>
</button>
</div>
</div>
</div>
<div class="flex justify-center mt-4">
<p class="text-caption font-caption text-outline">NeuraChat can make mistakes. Check important info.</p>
</div>
</div>
</section>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 left-0 w-full bg-gradient-to-t from-surface-container-lowest to-transparent py-4 z-10 pointer-events-none">
<div class="flex flex-col md:flex-row justify-between items-center px-8 max-w-7xl mx-auto gap-4 pointer-events-auto">
<span class="font-headline-md text-headline-md text-primary opacity-50 text-[16px]">NeuraChat AI</span>
<div class="flex gap-6">
<a class="font-caption text-caption text-on-surface-variant hover:text-secondary transition-colors opacity-80 hover:opacity-100" href="/terms.html">Terms</a>
<a class="font-caption text-caption text-on-surface-variant hover:text-secondary transition-colors opacity-80 hover:opacity-100" href="/terms.html">Privacy</a>
<a class="font-caption text-caption text-on-surface-variant hover:text-secondary transition-colors opacity-80 hover:opacity-100" href="/docs.html">Documentation</a>
</div>
<span class="font-caption text-caption text-secondary opacity-50">© 2024 NeuraChat AI. All rights reserved.</span>
</div>
</footer>
<script src="../js/script.js"></script>
</body></html>
