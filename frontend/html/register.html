<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuraChat — Create Account</title>
  <meta name="description" content="Create your free NeuraChat account — no credit card required." />
  <meta property="og:title" content="NeuraChat — Create Account" />
  <meta property="og:description" content="Join NeuraChat — Gemini-powered AI chat with persistent memory." />
  <meta property="og:image" content="/static/assets/og-image.png" />
  <link rel="icon" href="/static/assets/favicon.png" type="image/png" sizes="256x256" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            body: ['DM Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body class="bg-app text-app font-body antialiased overflow-x-hidden min-h-screen flex flex-col">
  <script>
    try {
      sessionStorage.setItem('neurachat-preloader-shown', '1');
    } catch (_) {}
  </script>
  <canvas id="particle-canvas" class="fixed inset-0 z-0 pointer-events-none opacity-40" aria-hidden="true"></canvas>

  <div class="relative z-10 flex flex-col flex-1 min-h-screen">
    <header class="pt-8 pb-4 px-4 sm:px-6 flex justify-center">
      <a href="/" class="inline-flex items-center gap-2 group" aria-label="NeuraChat home">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="shrink-0">
          <circle cx="16" cy="16" r="6" fill="#22d3ee" class="transition-transform group-hover:scale-110 origin-center" />
          <circle cx="16" cy="16" r="12" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5" />
        </svg>
        <span class="font-display font-bold text-xl tracking-tight text-[var(--text-primary)]">NeuraChat</span>
      </a>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 sm:px-6 py-8 pb-16">
      <div
        id="auth-card"
        class="w-full max-w-md rounded-2xl border border-[var(--border)] bg-[var(--bg-surface)] p-6 sm:p-8 shadow-[var(--shadow)]"
      >
        <h1 class="font-display font-bold text-2xl sm:text-3xl text-[var(--text-primary)] text-center mb-2">Create your account</h1>
        <p class="text-center text-[var(--text-secondary)] text-sm sm:text-base mb-8">Free forever. No credit card needed.</p>

        <form id="register-form" class="space-y-5" novalidate>
          <div>
            <label for="register-username" class="block text-sm font-medium text-[var(--text-primary)] mb-1.5">Full name</label>
            <div class="relative">
              <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--text-muted)]">
                <i data-lucide="user" class="w-5 h-5"></i>
              </span>
              <input
                id="register-username"
                name="username"
                type="text"
                autocomplete="name"
                required
                class="w-full rounded-xl border border-[var(--border)] bg-[var(--bg-surface-2)] pl-11 pr-4 py-3 text-sm text-[var(--text-primary)] placeholder:text-[var(--text-muted)] outline-none transition-all duration-200 focus:border-[var(--accent)] focus:ring-2 focus:ring-[var(--accent-glow-strong)]"
                placeholder="Your name"
              />
            </div>
            <p id="register-username-error" class="mt-1.5 text-sm text-red-400 hidden" role="alert"></p>
          </div>

          <div>
            <label for="register-email" class="block text-sm font-medium text-[var(--text-primary)] mb-1.5">Email</label>
            <div class="relative">
              <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--text-muted)]">
                <i data-lucide="mail" class="w-5 h-5"></i>
              </span>
              <input
                id="register-email"
                name="email"
                type="email"
                autocomplete="email"
                required
                class="w-full rounded-xl border border-[var(--border)] bg-[var(--bg-surface-2)] pl-11 pr-4 py-3 text-sm text-[var(--text-primary)] placeholder:text-[var(--text-muted)] outline-none transition-all duration-200 focus:border-[var(--accent)] focus:ring-2 focus:ring-[var(--accent-glow-strong)]"
                placeholder="you@example.com"
              />
            </div>
            <p id="register-email-error" class="mt-1.5 text-sm text-red-400 hidden" role="alert"></p>
          </div>

          <div>
            <label for="register-password" class="block text-sm font-medium text-[var(--text-primary)] mb-1.5">Password</label>
            <div class="relative">
              <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--text-muted)]">
                <i data-lucide="lock" class="w-5 h-5"></i>
              </span>
              <input
                id="register-password"
                name="password"
                type="password"
                autocomplete="new-password"
                required
                minlength="8"
                class="w-full rounded-xl border border-[var(--border)] bg-[var(--bg-surface-2)] pl-11 pr-12 py-3 text-sm text-[var(--text-primary)] placeholder:text-[var(--text-muted)] outline-none transition-all duration-200 focus:border-[var(--accent)] focus:ring-2 focus:ring-[var(--accent-glow-strong)]"
                placeholder="At least 8 characters"
              />
              <button
                type="button"
                class="absolute right-2 top-1/2 -translate-y-1/2 p-2 rounded-lg text-[var(--text-muted)] hover:text-[var(--accent)] hover:bg-[var(--bg-hover)] transition-all duration-200"
                data-toggle-password="register-password"
                aria-label="Show password"
              >
                <i data-lucide="eye" class="w-5 h-5 js-pw-icon-show"></i>
                <i data-lucide="eye-off" class="w-5 h-5 js-pw-icon-hide hidden"></i>
              </button>
            </div>
            <div class="mt-3 space-y-1.5">
              <div class="h-1.5 w-full rounded-full bg-[var(--bg-hover)] overflow-hidden flex">
                <div id="register-strength-bar" class="h-full w-0 transition-all duration-300 rounded-full bg-red-500"></div>
              </div>
              <p id="register-strength-text" class="text-xs font-medium text-[var(--text-muted)]">Password strength</p>
            </div>
            <p id="register-password-error" class="mt-1.5 text-sm text-red-400 hidden" role="alert"></p>
          </div>

          <div>
            <label for="register-confirm" class="block text-sm font-medium text-[var(--text-primary)] mb-1.5">Confirm password</label>
            <div class="relative">
              <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--text-muted)]">
                <i data-lucide="check" class="w-5 h-5"></i>
              </span>
              <input
                id="register-confirm"
                name="confirm"
                type="password"
                autocomplete="new-password"
                required
                class="w-full rounded-xl border border-[var(--border)] bg-[var(--bg-surface-2)] pl-11 pr-20 py-3 text-sm text-[var(--text-primary)] placeholder:text-[var(--text-muted)] outline-none transition-all duration-200 focus:border-[var(--accent)] focus:ring-2 focus:ring-[var(--accent-glow-strong)]"
                placeholder="Repeat password"
              />
              <span
                id="register-confirm-match"
                class="pointer-events-none absolute right-12 top-1/2 -translate-y-1/2 hidden text-emerald-400"
                aria-hidden="true"
              >
                <i data-lucide="check" class="w-5 h-5"></i>
              </span>
              <span
                id="register-confirm-mismatch"
                class="pointer-events-none absolute right-12 top-1/2 -translate-y-1/2 hidden text-red-400"
                aria-hidden="true"
              >
                <i data-lucide="x" class="w-5 h-5"></i>
              </span>
              <button
                type="button"
                class="absolute right-2 top-1/2 -translate-y-1/2 p-2 rounded-lg text-[var(--text-muted)] hover:text-[var(--accent)] hover:bg-[var(--bg-hover)] transition-all duration-200"
                data-toggle-password="register-confirm"
                aria-label="Show password"
              >
                <i data-lucide="eye" class="w-5 h-5 js-pw-icon-show"></i>
                <i data-lucide="eye-off" class="w-5 h-5 js-pw-icon-hide hidden"></i>
              </button>
            </div>
            <p id="register-confirm-error" class="mt-1.5 text-sm text-red-400 hidden" role="alert"></p>
          </div>

          <div>
            <label class="flex items-start gap-3 cursor-pointer text-sm text-[var(--text-secondary)]">
              <input id="register-terms" type="checkbox" class="mt-0.5 rounded border-[var(--border)] bg-[var(--bg-surface-2)] text-[var(--accent)] focus:ring-[var(--accent)] shrink-0" required />
              <span>
                I agree to the
                <a href="/terms.html" class="text-[var(--accent)] font-medium hover:underline">Terms of Service</a>
                and
                <a href="/terms.html" class="text-[var(--accent)] font-medium hover:underline">Privacy Policy</a>
              </span>
            </label>
            <p id="register-terms-error" class="mt-1.5 text-sm text-red-400 hidden" role="alert"></p>
          </div>

          <button
            type="submit"
            id="register-submit"
            class="relative w-full inline-flex items-center justify-center gap-2 rounded-xl py-3.5 px-4 text-sm font-semibold text-[#0f1117] bg-[var(--accent)] hover:bg-[var(--accent-hover)] shadow-[var(--shadow-accent)] transition-all duration-200 hover:scale-[1.01] active:scale-[0.99] disabled:opacity-70 disabled:pointer-events-none"
          >
            <span id="register-submit-label">Create Account</span>
            <span id="register-submit-spinner" class="hidden absolute inset-0 flex items-center justify-center" aria-hidden="true">
              <svg class="animate-spin h-5 w-5 text-[#0f1117]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </span>
          </button>
        </form>

        <p class="text-center text-sm text-[var(--text-secondary)] mt-8">
          Already have an account?
          <a href="/login.html" class="font-semibold text-[var(--accent)] hover:underline ml-1">Sign in →</a>
        </p>
      </div>
    </main>

    <footer class="relative z-10 border-t border-[var(--border)] bg-[var(--bg-surface)]/50 py-10 px-4 sm:px-6 mt-auto">
      <div class="max-w-6xl mx-auto flex flex-col sm:flex-row gap-6 sm:justify-between sm:items-center">
        <div>
          <p class="font-display font-bold text-lg text-[var(--text-primary)]">NeuraChat</p>
          <p class="text-[var(--text-secondary)] text-sm mt-1">Built by Ankush Poonia</p>
        </div>
        <div class="flex flex-wrap gap-4 justify-center sm:justify-end">
          <a href="https://github.com/ankush-poonia007/AI-Chatbot-Agentic-AI-NLP" target="_blank" rel="noopener noreferrer" class="p-2.5 rounded-full border border-[var(--border)] text-[var(--text-secondary)] hover:text-[var(--accent)] hover:border-[var(--border-accent)] transition-all" aria-label="GitHub">
            <i data-lucide="github" class="w-5 h-5"></i>
          </a>
          <a href="https://www.linkedin.com/in/ankush-poonia007" target="_blank" rel="noopener noreferrer" class="p-2.5 rounded-full border border-[var(--border)] text-[var(--text-secondary)] hover:text-[var(--accent)] hover:border-[var(--border-accent)] transition-all" aria-label="LinkedIn">
            <i data-lucide="linkedin" class="w-5 h-5"></i>
          </a>
        </div>
      </div>
      <p class="text-center text-xs text-[var(--text-muted)] mt-8">© 2026 NeuraChat. Open source portfolio project.</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/cursor.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
