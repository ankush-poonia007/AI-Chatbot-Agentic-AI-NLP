<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuraChat — Password Recovery</title>
  <meta name="description" content="Reset your NeuraChat password — we'll send a secure recovery link to your email." />
  <meta property="og:title" content="NeuraChat — Password Recovery" />
  <meta property="og:description" content="Recover your NeuraChat account with a secure email reset link." />
  <meta property="og:image" content="/static/assets/og-image.png" />
  <link rel="icon" href="/static/assets/favicon.png" type="image/png" sizes="256x256" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            body: ['DM Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body class="bg-app text-app font-body antialiased overflow-x-hidden min-h-screen flex flex-col">
  <script>
    try {
      sessionStorage.setItem('neurachat-preloader-shown', '1');
    } catch (_) {}
  </script>
  <canvas id="particle-canvas" class="fixed inset-0 z-0 pointer-events-none opacity-40" aria-hidden="true"></canvas>

  <div class="relative z-10 flex flex-col flex-1 min-h-screen">
    <header class="pt-8 pb-4 px-4 sm:px-6 flex justify-center">
      <a href="/" class="inline-flex items-center gap-2 group" aria-label="NeuraChat home">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="shrink-0">
          <circle cx="16" cy="16" r="6" fill="#22d3ee" class="transition-transform group-hover:scale-110 origin-center" />
          <circle cx="16" cy="16" r="12" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5" />
        </svg>
        <span class="font-display font-bold text-xl tracking-tight text-[var(--text-primary)]">NeuraChat</span>
      </a>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 sm:px-6 pb-16">
      <div
        id="auth-card"
        class="w-full max-w-md rounded-2xl border border-[var(--border)] bg-[var(--bg-surface)] p-6 sm:p-8 shadow-[var(--shadow)]"
      >
        <div id="recovery-step-1">
          <h1 class="font-display font-bold text-2xl sm:text-3xl text-[var(--text-primary)] text-center mb-2">Forgot your password?</h1>
          <p class="text-center text-[var(--text-secondary)] text-sm sm:text-base mb-8">Enter your email and we&apos;ll send a reset link.</p>

          <form id="recovery-form" class="space-y-5" novalidate>
            <div>
              <label for="recovery-email" class="block text-sm font-medium text-[var(--text-primary)] mb-1.5">Email address</label>
              <div class="relative">
                <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--text-muted)]">
                  <i data-lucide="mail" class="w-5 h-5"></i>
                </span>
                <input
                  id="recovery-email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  required
                  class="w-full rounded-xl border border-[var(--border)] bg-[var(--bg-surface-2)] pl-11 pr-4 py-3 text-sm text-[var(--text-primary)] placeholder:text-[var(--text-muted)] outline-none transition-all duration-200 focus:border-[var(--accent)] focus:ring-2 focus:ring-[var(--accent-glow-strong)]"
                  placeholder="you@example.com"
                />
              </div>
              <p id="recovery-email-error" class="mt-1.5 text-sm text-red-400 hidden" role="alert"></p>
            </div>

            <button
              type="submit"
              id="recovery-submit"
              class="relative w-full inline-flex items-center justify-center gap-2 rounded-xl py-3.5 px-4 text-sm font-semibold text-[#0f1117] bg-[var(--accent)] hover:bg-[var(--accent-hover)] shadow-[var(--shadow-accent)] transition-all duration-200 hover:scale-[1.01] active:scale-[0.99] disabled:opacity-70 disabled:pointer-events-none"
            >
              <span id="recovery-submit-label">Send Reset Link</span>
              <span id="recovery-submit-spinner" class="hidden absolute inset-0 flex items-center justify-center" aria-hidden="true">
                <svg class="animate-spin h-5 w-5 text-[#0f1117]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
              </span>
            </button>
          </form>

          <p class="text-center text-sm text-[var(--text-secondary)] mt-6">
            <a href="/login.html" class="font-medium text-[var(--accent)] hover:underline transition-all">Back to Login</a>
          </p>
        </div>

        <div id="recovery-step-2" class="hidden" aria-live="polite">
          <div class="flex justify-center mb-6">
            <i data-lucide="mail-check" class="w-12 h-12 text-[var(--accent)]" aria-hidden="true"></i>
          </div>
          <h1 class="font-display font-bold text-2xl sm:text-3xl text-[var(--text-primary)] text-center mb-2">Check your inbox</h1>
          <p class="text-center text-[var(--text-secondary)] text-sm sm:text-base mb-8">
            We sent a recovery link to
            <span id="recovery-email-display" class="font-medium text-[var(--text-primary)]"></span>.
            It expires in 15 minutes.
          </p>

          <p class="text-center text-sm mb-6">
            <button
              type="button"
              id="recovery-resend"
              class="font-medium text-[var(--text-muted)] cursor-not-allowed transition-all"
              disabled
            >
              Resend email
            </button>
            <span id="recovery-resend-timer" class="text-[var(--text-muted)]"></span>
          </p>

          <a
            href="/login.html"
            class="w-full inline-flex items-center justify-center rounded-xl py-3.5 px-4 text-sm font-semibold text-[var(--text-primary)] border border-[var(--border)] bg-[var(--bg-surface-2)] hover:bg-[var(--bg-hover)] hover:border-[var(--border-accent)] transition-all duration-200"
          >
            Back to Login
          </a>
        </div>
      </div>
    </main>

    <footer class="relative z-10 border-t border-[var(--border)] bg-[var(--bg-surface)]/50 py-10 px-4 sm:px-6 mt-auto">
      <div class="max-w-6xl mx-auto flex flex-col sm:flex-row gap-6 sm:justify-between sm:items-center">
        <div>
          <p class="font-display font-bold text-lg text-[var(--text-primary)]">NeuraChat</p>
          <p class="text-[var(--text-secondary)] text-sm mt-1">Built by Ankush Poonia</p>
        </div>
        <div class="flex flex-wrap gap-4 justify-center sm:justify-end">
          <a href="https://github.com/ankush-poonia007/AI-Chatbot-Agentic-AI-NLP" target="_blank" rel="noopener noreferrer" class="p-2.5 rounded-full border border-[var(--border)] text-[var(--text-secondary)] hover:text-[var(--accent)] hover:border-[var(--border-accent)] transition-all" aria-label="GitHub">
            <i data-lucide="github" class="w-5 h-5"></i>
          </a>
          <a href="https://www.linkedin.com/in/ankush-poonia007" target="_blank" rel="noopener noreferrer" class="p-2.5 rounded-full border border-[var(--border)] text-[var(--text-secondary)] hover:text-[var(--accent)] hover:border-[var(--border-accent)] transition-all" aria-label="LinkedIn">
            <i data-lucide="linkedin" class="w-5 h-5"></i>
          </a>
        </div>
      </div>
      <p class="text-center text-xs text-[var(--text-muted)] mt-8">© 2026 NeuraChat. Open source portfolio project.</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/cursor.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
