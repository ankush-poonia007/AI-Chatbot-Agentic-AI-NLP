<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../css/login.css">
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopNavBar Suppressed for Transactional Page but provided in JSON structure. 
       Note: The prompt explicitly asked for TopNavBar and Footer inclusion despite "Shell Suppression" rules. 
       I will include them as requested by the user prompt, which overrides the general heuristic. -->
<nav class="fixed top-4 left-1/2 -translate-x-1/2 w-[95%] rounded-xl border border-white/10 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl shadow-[0_0_20px_rgba(76,215,246,0.1)] z-50">
<div class="flex justify-between items-center px-6 py-3 max-w-7xl mx-auto">
<div class="font-headline-lg text-headline-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">NeuraChat</div>
<div class="hidden md:flex items-center gap-8">
<a class="text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md" href="/">Home</a>
<a class="text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md" href="/chat.html">Chat</a>
<a class="text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md" href="/docs.html">Docs</a>
<a class="text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md" href="/contact.html">Contact</a>
</div>
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-transform active:scale-95">notifications</button>
<button class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-transform active:scale-95">settings</button>
<div class="w-8 h-8 rounded-full overflow-hidden border border-primary/30">
<img alt="User profile avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCB5t2ocU30ckBtttbXjvR8b_DbOI8km6Ui-7XfGXTgg6bZ00P8bcGtVA5Doc1Ah_h1zDRBfBYM2wBdgT6rn0cwfEzjfjhcPohdckiuo-4CLLR0wT5LuETRU6gzL1al76nCkaSU7CwajcszCMNdBBk5DAEMpjvu8YcKBWbBUNK4XeKFyDMYOImukICaExTafubb0fJ5cZvMq-WaMlFzjpYzxRSmYotKWHMUbrqUUV98NLKb1INcvww6-Cq9iuV-r1SLYzs31BrR76fP"/>
</div>
</div>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-gutter pt-32 pb-24 relative overflow-hidden">
<!-- Background Accents -->
<div class="absolute top-1/4 -left-24 w-96 h-96 bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-1/4 -right-24 w-96 h-96 bg-secondary/10 rounded-full blur-[120px]"></div>
<div class="w-full max-w-md z-10">
<div class="glass-card bloom-violet rounded-2xl p-8 flex flex-col gap-8 transition-all duration-300">
<!-- Tabs -->

<!-- Header -->
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Reset Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your email to receive a reset link.</p>
</div>
<!-- Social Logins -->
<!-- Login Form -->
<form id="authForm" class="flex flex-col gap-5">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface ml-1">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-secondary transition-colors">mail</span>
<input class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-0 cyan-glow transition-all" placeholder="name@neura.ai" type="email"/>
</div>
</div>

</main>
<footer class="w-full py-8 border-t border-white/5 bg-surface-container-lowest dark:bg-surface-container-lowest bg-gradient-to-t from-surface to-transparent mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center px-8 max-w-7xl mx-auto gap-4">
<div class="font-headline-md text-headline-md text-primary font-bold">NeuraChat AI</div>
<div class="flex gap-6">
<a class="font-caption text-caption text-on-surface-variant hover:text-secondary transition-colors" href="/terms.html">Terms</a>
<a class="font-caption text-caption text-on-surface-variant hover:text-secondary transition-colors" href="/terms.html">Privacy</a>
<a class="font-caption text-caption text-on-surface-variant hover:text-secondary transition-colors" href="/docs.html">Documentation</a>
<a class="font-caption text-caption text-on-surface-variant hover:text-secondary transition-colors" href="/contact.html">Contact</a>
</div>
<div class="font-caption text-caption text-on-surface-variant">
        © 2024 NeuraChat AI. All rights reserved.
      </div>
</div>
</footer>

<script>
    const tabLogin = document.getElementById('tabLogin');
    const tabSignup = document.getElementById('tabSignup');
    const submitBtnText = document.getElementById('submitBtnText');
    const authForm = document.getElementById('authForm');
    
    if(tabLogin && tabSignup) {
        tabLogin.addEventListener('click', () => {
            tabLogin.className = "flex-1 py-2 font-label-md text-label-md rounded-md bg-secondary/10 text-secondary border border-secondary/20 transition-all";
            tabSignup.className = "flex-1 py-2 font-label-md text-label-md rounded-md text-on-surface-variant hover:text-primary transition-all";
            if(submitBtnText) submitBtnText.innerText = "Send Reset Link";
            const nameField = document.getElementById('nameField');
            if(nameField) nameField.style.display = 'none';
        });
        
        tabSignup.addEventListener('click', () => {
            tabSignup.className = "flex-1 py-2 font-label-md text-label-md rounded-md bg-secondary/10 text-secondary border border-secondary/20 transition-all";
            tabLogin.className = "flex-1 py-2 font-label-md text-label-md rounded-md text-on-surface-variant hover:text-primary transition-all";
            if(submitBtnText) submitBtnText.innerText = "Sign Up for NeuraChat";
            let nameField = document.getElementById('nameField');
            if(!nameField && authForm) {
                nameField = document.createElement('div');
                nameField.id = 'nameField';
                nameField.className = 'flex flex-col gap-1.5 mb-2';
                nameField.innerHTML = `
                    <label class="font-label-md text-label-md text-on-surface ml-1">Full Name</label>
                    <div class="relative group">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-secondary transition-colors">person</span>
                    <input class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-0 cyan-glow transition-all" placeholder="Satoshi Nakamoto" type="text"/>
                    </div>
                `;
                authForm.insertBefore(nameField, authForm.firstChild);
            } else if (nameField) {
                nameField.style.display = 'flex';
            }
        });
    }
</script>
</body></html>
